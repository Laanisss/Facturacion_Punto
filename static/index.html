<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Punto · Tu negocio, a tu manera</title><style>
:root{--accent:#17684b;--bg:#f5f6f3;--line:#e4e8e2;--text:#23382f}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);font:15px 'Segoe UI',sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:10px;padding:12px;color:inherit}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d79036;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}aside{position:fixed;inset:0 auto 0 0;width:210px;background:#fff;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column}.brand{font-size:30px;font-weight:750;letter-spacing:-1.5px;color:var(--accent);margin:0 12px 36px}.brand span{display:inline-block;background:var(--accent);color:white;border-radius:10px;padding:0 9px;margin-right:7px}nav button{width:100%;text-align:left;margin-bottom:8px;border:0;background:none}nav .active{background:#e9f2e9;color:var(--accent);font-weight:650}.foot{margin-top:auto;font-size:12px;color:#748277;padding:12px;line-height:1.7}main{margin-left:210px;padding:30px 36px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}h1{font-size:28px;letter-spacing:-.7px;margin:0 0 7px}h2{font-size:20px;margin:0 0 18px}p{color:#758178;line-height:1.5;margin:0}.badge{border:1px solid var(--line);padding:9px 14px;border-radius:30px;background:white;font-size:12px}.layout{display:grid;grid-template-columns:1fr 340px;gap:24px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:23px}.search{width:100%;padding:15px 17px;border:1px solid var(--line);border-radius:12px;background:white;margin-bottom:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.tabs .active,.primary{background:var(--accent);color:white;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}.product{text-align:left;padding:0;overflow:hidden;border-radius:16px}.art{height:118px;display:grid;place-items:center;font-size:49px;background:#f2efe6}.product:nth-child(3n+2) .art{background:#e8eee4}.product:nth-child(3n) .art{background:#f3e8de}.info{padding:15px}.info strong{display:block;margin-bottom:8px}.info small{display:block;color:#829084;margin-top:8px}.price{color:var(--accent);font-weight:650}.cart{display:flex;flex-direction:column;min-height:480px}.cartlines{flex:1}.empty{text-align:center;padding:70px 12px;color:#7a877c}.line{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.quantity{display:flex;gap:10px;align-items:center;margin-top:10px}.quantity button{padding:3px 10px}.total{display:flex;justify-content:space-between;font-size:23px;font-weight:700;margin:23px 0}.wide{width:100%}label{display:block;margin:15px 0 6px;font-weight:600;font-size:13px}input,select{padding:12px;border:1px solid #ccd4cc;border-radius:9px;width:100%;background:white;color:inherit}input[type=color]{height:48px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.muted{font-size:12px;color:#7a877c}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:15px}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:15px 10px;border-bottom:1px solid var(--line)}th{font-size:12px;color:#758178}dialog{border:0;border-radius:20px;padding:28px;width:min(460px,90vw);color:var(--text)}dialog::backdrop{background:#18322566}.actions{display:flex;gap:10px;margin-top:24px}.stat{font-size:32px;font-weight:700;margin:12px 0;color:var(--accent)}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#203e30;color:white;padding:14px 24px;border-radius:12px;display:none;z-index:99}.notice{background:#f8efd9;padding:12px;border-radius:10px;font-size:12px;margin-top:15px}#receipt{display:none}@media(max-width:1050px){aside{width:165px}main{margin-left:165px;padding:24px 20px}.layout{grid-template-columns:1fr 290px}}@media(max-width:760px){aside{position:static;width:auto;padding:16px}.brand{margin:0 0 12px}nav{display:flex;flex-wrap:wrap}nav button{width:auto}.foot{display:none}main{margin:0;padding:20px}.layout,.formgrid{grid-template-columns:1fr}.badge{display:none}.panel{overflow:auto}}@media print{body>*{display:none!important}#receipt{display:block!important;white-space:pre-wrap;font:14px monospace;color:black}}
.art img{width:100%;height:100%;object-fit:cover}.art{overflow:hidden}.business-logo{width:36px;height:36px;object-fit:contain;vertical-align:middle;margin-right:9px}.thumb{width:40px;height:40px;object-fit:cover;border-radius:8px;vertical-align:middle}.imagebox{padding:14px;border:1px dashed #b4c3b6;border-radius:12px;margin:12px 0}.imagepreview{display:block;width:100%;height:120px;object-fit:contain;background:#f3f5f0;border-radius:8px;margin-bottom:10px}.imagebox button{margin-top:8px}.logo-preview{height:75px;max-width:180px;object-fit:contain;margin-bottom:15px}.receipt-logo{display:block;max-width:150px;max-height:90px;object-fit:contain;margin:0 auto 16px}dialog{max-height:90vh;overflow:auto}#receipt{white-space:normal}@media print{#receipt{white-space:normal}#receipt pre{white-space:pre-wrap;font:14px monospace}}.ticket{max-width:330px;margin:20px auto;padding:24px 18px;text-align:center;background:white;border:1px solid #dde3dc;border-radius:12px;color:#222;overflow-wrap:anywhere}.ticket h2{margin:8px 0;font-size:22px}.ticket p{color:#444;font-size:12px;margin:7px 0}.ticket .receipt-item{padding:10px 0;border-bottom:1px dashed #ccc;break-inside:avoid}.ticket .receipt-total{font-size:23px;font-weight:750;margin:18px 0}.ticket .receipt-meta{font-size:10px}.ticket .receipt-rule{border:0;border-top:1px dashed #aaa;margin:16px 0}.ticket .receipt-footer{margin-top:20px}.template-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.template-card{text-align:left;padding:14px}.template-card small{display:block;margin-top:8px;line-height:1.5}.template-swatch{height:35px;border-radius:7px;margin-bottom:10px}.template-card[aria-pressed=true]{outline:2px solid var(--accent)}.session{display:flex;align-items:center;gap:10px}.session button{font-size:12px}.auth-screen{position:fixed;inset:0;z-index:100;background:#edf2ec;display:grid;place-items:center;padding:25px;overflow:auto}.auth-card{background:#fff;border:1px solid var(--line);border-radius:24px;width:min(470px,100%);padding:32px;box-shadow:0 20px 65px #173a2312}.auth-card .brand{margin:0 0 20px}.auth-card h1{font-size:25px}.auth-error{color:#a33126;min-height:24px;margin:10px 0}.checkrow{display:flex;gap:10px;align-items:flex-start;font-weight:400;line-height:1.5}.checkrow input{width:auto;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.stats .stat{font-size:26px}.payment-status{padding:12px;border-radius:10px;background:#f0f3ed;margin-top:14px}.sim{color:#895717;font-size:12px}@media(max-width:760px){.stats,.template-list{grid-template-columns:1fr}.session{flex-wrap:wrap}}@media print{@page{margin:5mm}#receipt{width:72mm;max-width:100%;margin:0 auto;white-space:normal!important}#receipt .ticket{max-width:none;width:100%;padding:0;margin:0;border:0;border-radius:0}#receipt .receipt-logo{max-width:40mm;max-height:22mm}.auth-screen{display:none!important}}body[data-template="boutique"]{--bg:#f6f2f5}body[data-template="studio"]{--bg:#eff3f8}body[data-template="boutique"] .product{border-radius:6px}body[data-template="studio"] .art{background:#e4ecf6}body[data-template="boutique"] .art{background:#f1e6ef}</style><aside><div class="brand"><span>p</span>punto</div><nav id="nav"></nav><div class="foot">TU NEGOCIO, A TU MANERA<br>Prototipo · versión 0.3.1 · servidor<br>Datos guardados en el servidor</div></aside><main><header><div><h1 id="title"></h1><p id="subtitle"></p></div><div class="session"><div class="badge" id="business"></div><button id="logout">Cerrar sesión</button></div></header><div id="view"></div></main><dialog id="modal"></dialog><div id="toast" role="status"></div><section id="receipt"></section><script>
'use strict';
let activeProfile=null;let csrf='';
const initial={settings:{name:'Mi negocio',currency:'L',color:'#17684b',type:'Comida',message:'¡Gracias por tu compra!'},products:[['Hamburguesa clásica',95,'Comida','🍔',30],['Pizza personal',120,'Comida','🍕',20],['Papas crujientes',45,'Comida','🍟',40],['Café latte',55,'Bebidas','☕',50],['Limonada fresca',35,'Bebidas','🍋',35],['Pastel de chocolate',65,'Postres','🍰',15],['Sándwich de pollo',80,'Comida','🥪',25],['Galleta artesanal',25,'Postres','🍪',30]].map((p,i)=>({id:String(i+1),name:p[0],price:p[1]*100,category:p[2],icon:p[3],stock:p[4]})),sales:[]};
let db=structuredClone(initial),page='Vender',cart={},category='Todos',query='';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>`${esc(db.settings.currency)} ${(n/100).toFixed(2)}`;
async function api(path,method='GET',body){let response;try{response=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},...(body===undefined?{}:{body:JSON.stringify(body)})})}catch{throw Error('No se pudo contactar al servidor. Si estabas cobrando, reintenta en esta misma ventana para evitar duplicados.')}const data=await response.json();if(!response.ok){if(response.status===401&&activeProfile){activeProfile=null;cart={};db=structuredClone(initial);$('#receipt').innerHTML='';$('#modal').close();showAuth()}throw Error(typeof data.detail==='string'?data.detail:'Revisa los datos del formulario.')}return data}
async function persist(){try{db=await api('/api/state','PUT',{settings:db.settings,products:db.products,revision:db.revision});return true}catch(error){alert(error.message);return false}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000)}
function total(){return Object.entries(cart).reduce((n,[id,q])=>n+db.products.find(p=>p.id===id).price*q,0)}
function render(){document.body.dataset.template=db.settings.template||'natural';document.documentElement.style.setProperty('--accent',db.settings.color);$('#business').innerHTML=(db.settings.logo?'<img class="business-logo" alt="Logo del negocio" src="'+esc(db.settings.logo)+'">':'')+esc(db.settings.name);$('#title').textContent=page==='Vender'?'Todo listo para una buena venta':page;$('#subtitle').textContent={Vender:'Elige los productos y nosotros hacemos las cuentas.',Productos:'Tu catálogo, siempre a mano.',Ventas:'Cada venta cuenta. Aquí están las tuyas.',Personalizar:'Haz que Punto se sienta como tu negocio.'}[page];$('#nav').innerHTML=(activeProfile?.role==='admin'?['Administración']:['Vender','Productos','Ventas','Personalizar']).map((n,i)=>`<button class="${page===n?'active':''}" data-page="${n}">${['▦','▤','↗','◉'][i]} &nbsp; ${n}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});if(page==='Vender')sell();if(page==='Productos')products();if(page==='Ventas')sales();if(page==='Personalizar')settings();if(page==='Administración'){adminPanel().catch(e=>toast(e.message));$('#subtitle').textContent='Negocios, acceso y planes de la plataforma.'}$('#logout').onclick=logout}
function sell(){$('#view').innerHTML=`<div class="layout"><section><input class="search" id="search" aria-label="Buscar productos" placeholder="Buscar un producto…" value="${esc(query)}"><div class="tabs" id="categories"></div><div class="grid" id="items"></div></section><section class="panel cart"><h2>Venta actual</h2><p class="muted">Ticket de demostración · sin validez fiscal</p><div class="cartlines" id="lines"></div><div class="total"><span>Total</span><span id="total"></span></div><button class="primary wide" id="checkout">Cobrar →</button><button style="margin-top:10px" id="clear">Vaciar pedido</button></section></div>`;$('#search').oninput=e=>{query=e.target.value;drawItems()};drawItems();drawCart();$('#clear').onclick=()=>{if(Object.keys(cart).length&&confirm('¿Vaciar este pedido?')){cart={};drawCart()}};$('#checkout').onclick=checkout}
function drawItems(){const cats=['Todos',...new Set(db.products.map(p=>p.category))];$('#categories').innerHTML=cats.map(c=>`<button class="${category===c?'active':''}">${esc(c)}</button>`).join('');$('#categories').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{category=cats[i];drawItems()});const list=db.products.filter(p=>(category==='Todos'||p.category===category)&&p.name.toLowerCase().includes(query.toLowerCase()));$('#items').innerHTML=list.map(p=>`<button class="product" data-id="${p.id}" ${p.stock===0?'disabled':''}><div class="art">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:esc(p.icon)}</div><div class="info"><strong>${esc(p.name)}</strong><span class="price">${money(p.price)}</span><small>${p.stock} disponibles · ${esc(p.category)}</small></div></button>`).join('')||'<p>No encontramos productos.</p>';$('#items').querySelectorAll('button').forEach(b=>b.onclick=()=>change(b.dataset.id,1))}
function change(id,n){const p=db.products.find(p=>p.id===id),q=(cart[id]||0)+n;if(q>p.stock)return toast('No hay más unidades disponibles');if(q<=0)delete cart[id];else cart[id]=q;drawCart()}
function drawCart(){$('#lines').innerHTML=Object.entries(cart).map(([id,q])=>{const p=db.products.find(p=>p.id===id);return `<div class="line"><div><strong>${esc(p.name)}</strong><div class="quantity"><button aria-label="Quitar una unidad" data-id="${id}" data-n="-1">−</button>${q}<button aria-label="Añadir una unidad" data-id="${id}" data-n="1">+</button></div></div><span>${money(p.price*q)}</span></div>`}).join('')||'<div class="empty">🛍<br><br>Tu próxima venta empieza aquí.<br><small>Selecciona un producto para añadirlo.</small></div>';$('#total').innerHTML=money(total());$('#checkout').disabled=!Object.keys(cart).length;$('#lines').querySelectorAll('button').forEach(b=>b.onclick=()=>change(b.dataset.id,Number(b.dataset.n)))}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal();$('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#modal').close())}

function checkout(){
 if(!Object.keys(cart).length)return;
 let busy=false,completed=false;const requestId=crypto.randomUUID();
 modal(`<h2>Cobrar venta</h2><p>Total a pagar</p><div class="stat">${money(total())}</div><form id="pay"><label for="method">Método de pago</label><select id="method"><option value="cash">Efectivo</option><option value="card_simulated">Tarjeta · simulación</option></select><div id="cashfields"><label for="received">Efectivo recibido</label><input id="received" type="number" min="${total()/100}" step="0.01" value="${total()/100}" required><p id="change" style="margin-top:15px">Cambio: ${money(0)}</p></div><div id="cardfields" hidden><div class="notice">SIMULACIÓN · No realiza cargos ni se conecta a un banco. No introduzcas datos de tarjetas reales.</div><label for="scenario">Resultado de prueba</label><select id="scenario"><option value="approved">Pago aprobado</option><option value="declined">Pago rechazado</option><option value="error">Sin conexión al terminal</option></select><p style="margin-top:12px">Terminal de prueba · Honduras<br>Tarjeta ficticia •••• 0000</p></div><p id="paymentstatus" role="status" class="payment-status" hidden></p><div class="actions"><button type="button" data-close id="cancelpay">Volver</button><button class="primary" id="submitpay">Confirmar venta</button></div></form>`);
 const method=$('#method'),receivedInput=$('#received'),submit=$('#submitpay'),status=$('#paymentstatus');
 method.onchange=()=>{const card=method.value==='card_simulated';$('#cashfields').hidden=card;$('#cardfields').hidden=!card;receivedInput.disabled=card;receivedInput.required=!card;submit.textContent=card?'Simular pago':'Confirmar venta';status.hidden=true};
 receivedInput.oninput=()=>{$('#change').innerHTML='Cambio: '+money(Math.max(0,Math.round(Number(receivedInput.value)*100)-total()))};
 $('#modal').oncancel=e=>{if(busy)e.preventDefault()};
 $('#pay').onsubmit=async e=>{e.preventDefault();if(busy||completed)return;const card=method.value==='card_simulated',amount=total(),received=card?amount:Math.round(Number(receivedInput.value)*100);if(!Number.isSafeInteger(received)||received<amount)return;
 busy=true;submit.disabled=true;method.disabled=true;$('#cancelpay').disabled=true;$('#scenario').disabled=true;
 try{
 status.hidden=false;status.textContent=card?'Procesando pago de prueba en el servidor…':'Guardando venta…';
 const result=await api('/api/sales','POST',{request_id:requestId,revision:db.revision,lines:Object.entries(cart).map(([id,quantity])=>({id,quantity})),method:card?'card_simulated':'cash',received,scenario:$('#scenario').value});
 db=result.state;completed=true;cart={};$('#modal').close();render();ticket(result.sale);
 }catch(error){status.hidden=false;status.textContent=error.message;

 }finally{busy=false;if(!completed){submit.disabled=false;method.disabled=false;$('#cancelpay').disabled=false;$('#scenario').disabled=false}}};
}
function receiptMarkup(s){const m=n=>`${esc(s.settings.currency)} ${(n/100).toFixed(2)}`,card=s.payment?.method==='card_simulated';return `<article class="ticket">${s.settings.logo?`<img class="receipt-logo" alt="Logo del negocio" src="${esc(s.settings.logo)}">`:''}<h2>${esc(s.settings.name)}</h2><p>TICKET DE DEMOSTRACIÓN<br>SIN VALIDEZ FISCAL</p>${card?'<p><strong>PAGO CON TARJETA SIMULADO<br>NO SE REALIZÓ NINGÚN CARGO</strong></p>':''}<hr class="receipt-rule"><p>${esc(new Date(s.date).toLocaleString('es-HN'))}</p><p class="receipt-meta">Ref. ${esc(s.id)}</p><hr class="receipt-rule">${s.lines.map(l=>`<div class="receipt-item"><strong>${esc(l.name)}</strong><p>${l.quantity} × ${m(l.price)}</p><strong>${m(l.quantity*l.price)}</strong></div>`).join('')}<div class="receipt-total">TOTAL ${m(s.total)}</div><p>${card?'Tarjeta · simulación':'Efectivo'}</p>${card?`<p>Referencia de prueba: ${esc(s.payment.reference)}<br>Tarjeta ficticia •••• 0000</p>`:`<p>Recibido: ${m(s.received)}<br>Cambio: ${m(s.received-s.total)}</p>`}<hr class="receipt-rule"><p class="receipt-footer">${esc(s.settings.message)}</p></article>`}
function ticket(s){const markup=receiptMarkup(s);$('#receipt').innerHTML=markup;modal(`<h2 style="text-align:center">Recibo de venta</h2>${markup}<div class="actions"><button data-close>Continuar</button><button class="primary" id="print">Imprimir recibo</button></div>`);$('#print').onclick=()=>window.print()}
function products(){$('#view').innerHTML=`<div class="panel"><div class="toolbar"><h2>Productos <span class="muted">${db.products.length} en tu catálogo</span></h2><button class="primary" id="add">+ Nuevo producto</button></div><table><thead><tr><th>PRODUCTO</th><th>CATEGORÍA</th><th>PRECIO</th><th>EXISTENCIAS</th><th></th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${p.image?`<img class="thumb" src="${esc(p.image)}" alt="">`:esc(p.icon)} &nbsp; ${esc(p.name)}</td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><button data-edit="${p.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>`;$('#add').onclick=()=>edit();$('#view').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}
function edit(id){if(Object.keys(cart).length)return toast('Finaliza o vacía el pedido antes de editar el catálogo');const p=db.products.find(p=>p.id===id)||{name:'',price:0,category:'General',stock:0,icon:'📦'};modal(`<h2>${id?'Editar':'Nuevo'} producto</h2><form id="productform"><label>Nombre<input name="name" maxlength="80" value="${esc(p.name)}" required></label><label>Categoría<input name="category" maxlength="35" value="${esc(p.category)}" required></label><label>Precio<input name="price" type="number" min="0.01" max="10000000" step="0.01" value="${p.price/100}" required></label><label>Existencias<input name="stock" type="number" min="0" max="1000000" step="1" value="${p.stock}" required></label><div id="productimage"></div><label>Icono alternativo (si no hay foto)<input name="icon" maxlength="12" value="${esc(p.icon)}" required></label><div class="actions"><button type="button" data-close>Cancelar</button><button class="primary">Guardar producto</button></div></form>`);const picture=imagePicker($('#productimage'),p.image||'',false);$('#productform').onsubmit=async e=>{e.preventDefault();if(picture.busy())return toast('Espera a que termine de cargar la imagen');const f=new FormData(e.target),v={id:id||crypto.randomUUID(),name:f.get('name').trim(),category:f.get('category').trim(),price:Math.round(Number(f.get('price'))*100),stock:Number(f.get('stock')),icon:f.get('icon').trim(),image:picture.value()};if(!v.name||!v.category||!v.icon)return;const old=structuredClone(db);if(id)Object.assign(p,v);else db.products.push(v);if(!await persist()){db=old;return}$('#modal').close();render();toast('Producto guardado')};guardForm($('#productform'))}

function sales(){const cash=db.sales.filter(s=>s.payment?.method!=='card_simulated'),card=db.sales.filter(s=>s.payment?.method==='card_simulated');const sum=rows=>rows.reduce((n,s)=>n+s.total,0);$('#view').innerHTML=`<div class="stats"><div class="panel"><p>Ventas en efectivo</p><div class="stat">${money(sum(cash))}</div><p>${cash.length} operaciones</p></div><div class="panel"><p>Tarjetas · simulación</p><div class="stat">${money(sum(card))}</div><p class="sim">${card.length} pruebas · sin cargos reales</p></div><div class="panel"><p>Operaciones registradas</p><div class="stat">${db.sales.length}</div><p>Incluye las simulaciones</p></div></div><div class="panel"><h2>Historial de ventas</h2><table><thead><tr><th>FECHA</th><th>PRODUCTOS</th><th>MÉTODO</th><th>TOTAL</th><th></th></tr></thead><tbody>${[...db.sales].reverse().map(s=>`<tr><td>${esc(new Date(s.date).toLocaleString('es-HN'))}</td><td>${s.lines.reduce((n,l)=>n+l.quantity,0)}</td><td>${s.payment?.method==='card_simulated'?'Tarjeta · simulación':'Efectivo'}</td><td>${money(s.total)}</td><td><button data-ticket="${s.id}">Ver recibo</button></td></tr>`).join('')}</tbody></table>${!db.sales.length?'<div class="empty">Las ventas aparecerán aquí cuando cobres tu primer pedido.</div>':''}</div>`;$('#view').querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>ticket(db.sales.find(s=>s.id===b.dataset.ticket)))}
function settings(){const s=db.settings;$('#view').innerHTML=`<div class="formgrid"><section class="panel"><h2>La identidad de tu negocio</h2><p>Perfil: <strong>${esc(activeProfile?.username||"Local")}</strong></p><form id="settings"><label>Plantilla visual</label><div id="templates" class="template-list"></div><div id="logoimage"></div><label>Nombre del negocio<input name="name" value="${esc(s.name)}" maxlength="70" required></label><label>Tipo de negocio<select name="type">${['Comida','Tienda','Negocio general'].map(t=>`<option ${s.type===t?'selected':''}>${t}</option>`).join('')}</select></label><p class="muted" style="margin-top:8px">Identifica tu negocio. Los módulos por tipo llegarán en otra versión.</p><label>Moneda<select name="currency">${['L','$','€'].map(c=>`<option ${s.currency===c?'selected':''}>${c}</option>`).join('')}</select></label><p class="muted" style="margin-top:8px">No convierte precios. Se bloquea al registrar la primera venta.</p><label>Color principal<input type="color" name="color" value="${esc(s.color)}"></label><label>Mensaje del ticket<input name="message" maxlength="120" value="${esc(s.message)}"></label><button class="primary wide" style="margin-top:20px">Guardar cambios</button></form></section><section><div class="panel"><h2>Un espacio con tu nombre</h2><div style="padding:30px;background:var(--bg);border-radius:12px;text-align:center"><img id="previewlogo" class="logo-preview" alt="Logo del negocio" ${s.logo?`src="${esc(s.logo)}"`:"hidden"}><h2 id="previewname">${esc(s.name)}</h2><p>Tu próximo cliente está por llegar.</p><button class="primary" style="margin-top:25px" disabled>Así se verá tu color</button></div></div><div class="panel" style="margin-top:20px"><h2>Tus datos, a mano</h2><p>Descarga productos, configuración e historial en un archivo JSON.</p><button id="export" class="wide" style="margin-top:15px">Descargar copia de datos</button><div class="notice">Prototipo para evaluar el diseño. Datos guardados en el servidor. Esta base necesita conexión para vender. No incluye facturación fiscal ni cobros bancarios reales. Las copias JSON son de exportación; la restauración guiada está pendiente.</div></div><div class="panel" style="margin-top:20px"><h2>Conexión BAC HIT</h2><p>Estado: pendiente de integración oficial.</p><p>No se envían cobros a HIT. Puedes probar tarjetas simuladas desde la caja.</p></div><div class="panel" style="margin-top:20px"><h2>Actualizaciones</h2><p>Versión 0.3.1 · servidor · prototipo</p><p style="margin-top:12px">Esta interfaz se sirve desde el servidor. Al actualizar el servidor, recarga para abrir la versión nueva. El instalador Windows con actualizaciones firmadas está en el roadmap.</p><span class="badge" style="display:inline-block;margin-top:12px">Instalador Windows: pendiente</span></div></section></div>`;const f=$('#settings');let chosenTemplate=s.template||'natural';drawTemplates(f,chosenTemplate,key=>chosenTemplate=key);const logo=imagePicker($('#logoimage'),s.logo||'',true,value=>{const img=$('#previewlogo');img.hidden=!value;if(value)img.src=value;else img.removeAttribute('src')});f.elements.currency.disabled=db.sales.length>0;f.elements.name.oninput=e=>$('#previewname').textContent=e.target.value;f.elements.color.oninput=e=>document.documentElement.style.setProperty('--accent',e.target.value);f.onsubmit=async e=>{e.preventDefault();if(logo.busy())return toast('Espera a que termine de cargar el logo');const old=structuredClone(db);const data=Object.fromEntries(new FormData(f));if(!data.name.trim())return;db.settings={...db.settings,...data,name:data.name.trim(),logo:logo.value(),template:chosenTemplate};if(!await persist()){db=old;return}render();toast('Tu negocio ya tiene su estilo')};guardForm(f);$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='punto-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}

function imagePicker(container,current,isLogo,onChange=()=>{}){
 let value=current,busy=false,sequence=0;
 container.innerHTML=`<div class="imagebox"><label>${isLogo?'Logo del negocio':'Foto del producto'}</label><img class="imagepreview" alt="Vista previa" ${current?`src="${esc(current)}"`:'hidden'}><input aria-label="${isLogo?'Subir logo':'Subir foto del producto'}" type="file" accept="image/png,image/jpeg,image/webp"><p class="muted">PNG, JPG o WebP · máximo 8 MB. Se optimiza al cargar.</p><button type="button">Quitar imagen</button><p class="muted" role="status"></p></div>`;
 const input=container.querySelector('input'),preview=container.querySelector('img'),remove=container.querySelector('button'),status=container.querySelector('[role=status]');
 const update=()=>{preview.hidden=!value;if(value)preview.src=value;else preview.removeAttribute('src');remove.disabled=!value&&!busy;onChange(value)};
 remove.onclick=()=>{sequence++;busy=false;value='';input.value='';status.textContent='';update()};
 input.onchange=async()=>{const file=input.files[0];if(!file)return;const token=++sequence;busy=true;status.textContent='Preparando imagen…';remove.disabled=false;
 try{const result=await optimizeImage(file,isLogo);if(token!==sequence)return;value=result;status.textContent='Imagen lista. Guarda los cambios para conservarla.';update()}
 catch(error){if(token===sequence){status.textContent=error.message;input.value=''}}
 finally{if(token===sequence){busy=false;remove.disabled=!value}}};
 update();return{value:()=>value,busy:()=>busy};
}
async function optimizeImage(file,isLogo){
 if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Elige una imagen PNG, JPG o WebP.');
 if(file.size>8*1024*1024)throw Error('La imagen supera los 8 MB. Elige una más pequeña.');
 const url=URL.createObjectURL(file);
 try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('No se pudo abrir esta imagen. Prueba con otra.'));img.src=url});
 if(!img.naturalWidth||!img.naturalHeight||img.naturalWidth*img.naturalHeight>40000000)throw Error('La imagen es demasiado grande. Reduce sus dimensiones.');
 const max=isLogo?300:640,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
 const context=canvas.getContext('2d');if(!context)throw Error('Este navegador no puede procesar imágenes.');context.drawImage(img,0,0,canvas.width,canvas.height);
 const result=canvas.toDataURL('image/webp',.8);if(result.length>450000)throw Error('La imagen sigue siendo muy pesada. Usa una más sencilla.');return result;
 }finally{URL.revokeObjectURL(url)}
}

const THEMES={natural:{name:'Natural',color:'#17684b',description:'Cafés y comida · tonos verdes',bg:'#f5f6f3'},boutique:{name:'Boutique',color:'#754565',description:'Tiendas · tonos ciruela',bg:'#f6f2f5'},studio:{name:'Estudio',color:'#285c91',description:'General · tonos azules',bg:'#eff3f8'}};
function drawTemplates(form,current,select){$('#templates').innerHTML=Object.entries(THEMES).map(([key,t])=>`<button type="button" class="template-card" data-theme="${key}" aria-pressed="${key===current}"><div class="template-swatch" style="background:${t.color}"></div><strong>${t.name}</strong><small>${t.description}</small></button>`).join('');$('#templates').querySelectorAll('button').forEach(b=>b.onclick=()=>{const key=b.dataset.theme;select(key);form.elements.color.value=THEMES[key].color;document.documentElement.style.setProperty('--accent',THEMES[key].color);document.body.dataset.template=key;drawTemplates(form,key,select)})}

function guardForm(form){const handler=form.onsubmit;let pending=false;form.onsubmit=async event=>{if(pending){event.preventDefault();return}pending=true;const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await handler(event)}finally{pending=false;buttons.forEach(b=>b.disabled=false)}}}
async function enterProfile(){activeProfile=await api('/api/me');csrf=activeProfile.csrf;if(activeProfile.role==='admin'){db=structuredClone(initial);db.settings.name='Administración Punto';page='Administración'}else{db=await api('/api/state');page='Vender'}cart={};query='';category='Todos';$('#auth')?.remove();document.querySelector('main').hidden=false;document.querySelector('aside').hidden=false;render();if(activeProfile.business&&(activeProfile.business.status==='suspended'||activeProfile.business.expires<=Date.now()/1000))toast('Acceso de consulta: la suscripción está suspendida o vencida.')}
async function logout(){if(Object.keys(cart).length&&!confirm('El pedido sin cobrar se descartará. ¿Cerrar sesión?'))return;try{await api('/api/logout','POST',{});$('#modal').close();$('#modal').innerHTML='';$('#receipt').innerHTML='';activeProfile=null;csrf='';cart={};db=structuredClone(initial);showAuth()}catch(error){toast(error.message)}}
function showAuth(register=false){document.querySelector('main').hidden=true;document.querySelector('aside').hidden=true;let root=$('#auth');if(!root){root=document.createElement('div');root.id='auth';root.className='auth-screen';document.body.appendChild(root)}root.innerHTML=`<section class="auth-card"><div class="brand"><span>p</span>punto</div><h1>${register?'Crea tu negocio':'Bienvenido a Punto'}</h1><p>${register?'Tu catálogo y ventas, guardados en el servidor.':'Inicia sesión para abrir tu espacio.'}</p><form id="authform">${register?'<label>Nombre del negocio<input name="business" maxlength="70" required autocomplete="organization"></label>':''}<label>Usuario<input name="username" pattern="[a-zA-Z0-9_.-]{3,40}" title="Entre 3 y 40 letras, números, puntos o guiones" required autocomplete="username"></label><label>Contraseña<input name="password" type="password" minlength="10" maxlength="128" required autocomplete="${register?'new-password':'current-password'}"></label>${register?'<label>Repite la contraseña<input name="confirm" type="password" minlength="10" required autocomplete="new-password"></label>':''}<p id="autherror" class="auth-error" role="alert"></p><button id="authsubmit" class="primary wide">${register?'Crear negocio · prueba de 14 días':'Entrar'}</button></form><button id="authtoggle" class="wide" style="margin-top:10px">${register?'Ya tengo cuenta':'Registrar negocio'}</button><p class="muted" style="margin-top:20px">Versión 0.3.1 · piloto con servidor. La prueba no genera cargos. No se importan automáticamente los perfiles del HTML anterior.</p></section>`;
 $('#authtoggle').onclick=()=>showAuth(!register);$('#authform').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.target),button=$('#authsubmit'),toggle=$('#authtoggle');button.disabled=true;toggle.disabled=true;$('#autherror').textContent='';try{if(register&&form.get('password')!==form.get('confirm'))throw Error('Las contraseñas no coinciden.');const result=await api(register?'/api/register':'/api/login','POST',{username:form.get('username').trim(),password:form.get('password'),...(register?{business:form.get('business').trim()}:{})});csrf=result.csrf;await enterProfile()}catch(error){$('#autherror').textContent=error.message}finally{button.disabled=false;toggle.disabled=false}};
}
async function adminPanel(){const rows=await api('/api/admin/businesses');$('#view').innerHTML=`<div class="stats"><div class="panel"><p>Negocios registrados</p><div class="stat">${rows.length}</div></div><div class="panel"><p>Pruebas vigentes</p><div class="stat">${rows.filter(r=>r.status==='trial'&&r.expires>Date.now()/1000).length}</div></div><div class="panel"><p>Suscripciones</p><p style="margin-top:16px">Control manual. No hay cargos recurrentes automáticos.</p></div></div><div class="panel"><h2>Control de negocios</h2><table><thead><tr><th>NEGOCIO / USUARIO</th><th>ACCESO</th><th>PLAN</th><th>VENCE (UTC)</th><th>VENTAS</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.name)}</strong><br>${esc(r.username)}</td><td>${r.status==='suspended'?'Suspendido':r.expires<=Date.now()/1000?'Vencido':r.status==='trial'?'En prueba':'Activo'}</td><td>${esc(r.plan)}</td><td>${new Date(r.expires*1000).toISOString().slice(0,10)}</td><td>${r.sales_count}</td><td><button data-manage="${r.id}">Gestionar</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<p>Todavía no hay negocios. Registra uno desde la pantalla de inicio.</p>'}</div><div class="panel" style="margin-top:20px"><h2>Registro de administración</h2><button id="audit">Ver últimos cambios</button><div id="auditlist"></div></div>`;$('#view').querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>editSubscription(rows.find(r=>r.id===b.dataset.manage)));$('#audit').onclick=async()=>{try{const audit=await api('/api/admin/audit');$('#auditlist').innerHTML=audit.map(r=>{const d=JSON.parse(r.detail);return `<p style="padding:12px 0;border-bottom:1px solid var(--line)">${esc(new Date(r.created*1000).toLocaleString())} · ${esc(d.after.status)} / ${esc(d.after.plan)}<br>${esc(d.after.reason)}<br><small>Negocio: ${esc(r.target)}</small></p>`}).join('')||'<p>No hay cambios registrados.</p>'}catch(e){toast(e.message)}}}
function editSubscription(b){modal(`<h2>${esc(b.name)}</h2><p>Modifica su acceso. Esto no realiza un cobro.</p><form id="subscription"><label>Estado<select name="status">${['trial','active','suspended'].map((s,i)=>`<option value="${s}" ${b.status===s?'selected':''}>${['En prueba','Activo','Suspendido'][i]}</option>`).join('')}</select></label><label>Plan<select name="plan">${['trial','basic','pro'].map(s=>`<option ${b.plan===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Último día con acceso (UTC)<input name="date" type="date" min="2020-01-01" max="2099-12-31" required value="${new Date(b.expires*1000-1).toISOString().slice(0,10)}"></label><label>Motivo del cambio<input name="reason" minlength="3" maxlength="200" required placeholder="Ej.: extensión del período de prueba"></label><div class="actions"><button type="button" data-close>Cancelar</button><button class="primary">Guardar acceso</button></div><p id="suberror" role="alert"></p></form>`);$('#subscription').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button.primary');button.disabled=true;try{const f=new FormData(e.target);await api('/api/admin/businesses/'+b.id+'/subscription','PATCH',{status:f.get('status'),plan:f.get('plan'),expires:Math.floor(Date.parse(f.get('date')+'T00:00:00Z')/1000)+86400,reason:f.get('reason')});$('#modal').close();await adminPanel()}catch(error){$('#suberror').textContent=error.message}finally{button.disabled=false}}}
showAuth();enterProfile().catch(()=>{});
</script></html>
