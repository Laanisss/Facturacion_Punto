let db=structuredClone(initial),page='Vender',cart={},category='Todos',query='';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>`${esc(db.settings.currency)} ${(n/100).toFixed(2)}`;
async function api(path,method='GET',body){let response;try{response=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},...(body===undefined?{}:{body:JSON.stringify(body)})})}catch{throw Error('No se pudo contactar al servidor. Si estabas cobrando, reintenta en esta misma ventana para evitar duplicados.')}const data=await response.json();if(!response.ok){if(response.status===401&&activeProfile){activeProfile=null;customersCache=[];promotionsCache=[];cart={};db=structuredClone(initial);$('#receipt').innerHTML='';$('#modal').close();showAuth()}throw Error(typeof data.detail==='string'?data.detail:'Revisa los datos del formulario.')}return data}

function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000)}
function total(){return Object.entries(cart).reduce((n,[id,q])=>n+db.products.find(p=>p.id===id).price*q,0)}
function render(){document.body.dataset.template=db.settings.template||'natural';document.documentElement.style.setProperty('--accent',db.settings.color);$('#business').innerHTML=(db.settings.logo?'<img class="business-logo" alt="Logo del negocio" src="'+esc(db.settings.logo)+'">':'')+esc(db.settings.name);$('#title').textContent=page==='Vender'?'Todo listo para una buena venta':page;$('#subtitle').textContent={Vender:'Elige los productos y nosotros hacemos las cuentas.',Productos:'Tu catálogo, siempre a mano.',Ventas:'Cada venta cuenta. Aquí están las tuyas.',Personalizar:'Haz que Punto se sienta como tu negocio.'}[page]||'Tu espacio de trabajo en Punto.';$('#nav').innerHTML=(activeProfile?.role==='admin'?['Administración','Planes y cobros']:['Inicio','Vender','Caja','Productos','Inventario','Clientes','Promociones','Ventas','Reportes','Suscripción','Personalizar']).map((n,i)=>`<button class="${page===n?'active':''}" data-page="${n}">${({'Inicio':'⌂','Vender':'▦','Caja':'◈','Productos':'▤','Inventario':'◫','Clientes':'◎','Promociones':'✦','Ventas':'↗','Reportes':'▥','Suscripción':'◉','Personalizar':'⚙','Administración':'▦','Planes y cobros':'◈'}[n])} &nbsp; ${n}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});if(page==='Promociones')promotionsPage().catch(e=>toast(e.message));if(page==='Inicio')homePage().catch(e=>toast(e.message));if(page==='Caja')cashPage().catch(e=>toast(e.message));if(page==='Inventario')inventoryPage().catch(e=>toast(e.message));if(page==='Clientes')clientsPage().catch(e=>toast(e.message));if(page==='Suscripción')subscriptionPage().catch(e=>toast(e.message));if(page==='Reportes')reportsPage();if(page==='Planes y cobros')billingAdmin().catch(e=>toast(e.message));if(page==='Vender')sell();if(page==='Productos')products();if(page==='Ventas')sales();if(page==='Personalizar')settings();if(page==='Administración'){adminPanel().catch(e=>toast(e.message));$('#subtitle').textContent='Negocios, acceso y planes de la plataforma.'}$('#logout').onclick=logout;$('#refresh').onclick=async()=>{if(Object.keys(cart).length&&!confirm('Actualizar vaciará el pedido actual. ¿Continuar?'))return;const target=page;try{await enterProfile();page=target;render();toast('Datos actualizados')}catch(e){toast(e.message)}}}
function sell(){$('#view').innerHTML=`<div class="layout"><section><input class="search" id="search" aria-label="Buscar productos" placeholder="Buscar un producto…" value="${esc(query)}"><div class="tabs" id="categories"></div><div class="grid" id="items"></div></section><section class="panel cart"><h2>Venta actual</h2><p class="muted">Ticket de demostración · sin validez fiscal</p><div class="cartlines" id="lines"></div><div class="total"><span>Total</span><span id="total"></span></div><button class="primary wide" id="checkout">Cobrar →</button><button style="margin-top:10px" id="clear">Vaciar pedido</button></section></div>`;$('#search').oninput=e=>{query=e.target.value;drawItems()};drawItems();drawCart();$('#clear').onclick=()=>{if(Object.keys(cart).length&&confirm('¿Vaciar este pedido?')){cart={};drawCart()}};$('#checkout').onclick=checkout}

function change(id,n){const p=db.products.find(p=>p.id===id),q=(cart[id]||0)+n;if(q>p.stock)return toast('No hay más unidades disponibles');if(q<=0)delete cart[id];else cart[id]=q;drawCart()}

function checkout(){
 if(!Object.keys(cart).length)return;
 let busy=false,completed=false;const requestId=crypto.randomUUID();const availablePromotions=promotionsCache.filter(p=>promotionDiscount(p)>0);
 modal(`<h2>Cobrar venta</h2><p>Total a pagar</p><div class="stat" id="checkouttotal">${money(total())}</div><form id="pay"><label>Cliente<select id="saleclient"><option value="">Consumidor final</option>${customersCache.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label><label>Promoción<select id="salepromotion"><option value="">Sin promoción · descuento manual opcional</option>${availablePromotions.map(p=>`<option value="${p.id}">${esc(p.name)} · ${promotionLabel(p)}</option>`).join('')}</select></label><p class="muted">Solo se muestran promociones vigentes que cumplen los productos y la compra mínima.</p><div class="checkout-discount"><label>Descuento (${esc(db.settings.currency)})<input id="discount" type="number" min="0" max="${total()/100}" step="0.01" value="0"></label><label>Motivo del descuento<input id="discountreason" maxlength="120" placeholder="Ej.: promoción"></label></div><label for="method">Método de pago</label><select id="method"><option value="cash">Efectivo</option><option value="card_simulated">Tarjeta · simulación</option></select><div id="cashfields"><label for="received">Efectivo recibido</label><input id="received" type="number" min="${total()/100}" step="0.01" value="${total()/100}" required><p id="change" style="margin-top:15px">Cambio: ${money(0)}</p></div><div id="cardfields" hidden><div class="notice">SIMULACIÓN · No realiza cargos ni se conecta a un banco. No introduzcas datos de tarjetas reales.</div><label for="scenario">Resultado de prueba</label><select id="scenario"><option value="approved">Pago aprobado</option><option value="declined">Pago rechazado</option><option value="error">Sin conexión al terminal</option></select><p style="margin-top:12px">Terminal de prueba · Honduras<br>Tarjeta ficticia •••• 0000</p></div><p id="paymentstatus" role="status" class="payment-status" hidden></p><div class="actions"><button type="button" data-close id="cancelpay">Volver</button><button class="primary" id  const method=$('#method'),receivedInput=$('#received'),submit=$('#submitpay'),status=$('#paymentstatus');
 method.onchange=()=>{const card=method.value==='card_simulated';$('#cashfields').hidden=card;$('#cardfields').hidden=!card;receivedInput.disabled=card;receivedInput.required=!card;submit.textContent=card?'Simular pago':'Confirmar venta';status.hidden=true};
 const discountInput=$('#discount'),promotionSelect=$('#salepromotion'),chosenPromotion=()=>availablePromotions.find(p=>p.id===promotionSelect.value),net=()=>total()-(chosenPromotion()?promotionDiscount(chosenPromotion()):Math.round(Number(discountInput.value)*100));
 const updatePayment=()=>{$('#checkouttotal').innerHTML=money(net());receivedInput.min=net()/100;$('#discountreason').required=Number(discountInput.value)>0;$('#change').innerHTML='Cambio: '+money(Math.max(0,Math.round(Number(receivedInput.value)*100)-net()))};
 receivedInput.oninput=updatePayment;discountInput.oninput=updatePayment;
 promotionSelect.onchange=()=>{const p=chosenPromotion();discountInput.value=p?(promotionDiscount(p)/100).toFixed(2):'0';discountInput.disabled=!!p;$('#discountreason').value=p?'Promoción: '+p.name:'';$('#discountreason').disabled=!!p;updatePayment()};
 $('#modal').oncancel=e=>{if(busy)e.preventDefault()};
 $('#pay').onsubmit=async e=>{e.preventDefault();if(busy||completed)return;const card=method.value==='card_simulated',amount=net(),received=card?amount:Math.round(Number(receivedInput.value)*100);if(!Number.isSafeInteger(amount)||amount<0||amount>total()||!Number.isSafeInteger(received)||received<amount)return;
 busy=true;submit.disabled=true;method.disabled=true;$('#cancelpay').disabled=true;$('#scenario').disabled=true;promotionSelect.disabled=true;discountInput.disabled=true;$('#discountreason').disabled=true;
 try{
 status.hidden=false;status.textContent=card?'Procesando pago de prueba en el servidor…':'Guardando venta…';
 const result=await api('/api/sales','POST',{request_id:requestId,revision:db.revision,lines:Object.entries(cart).map(([id,quantity])=>({id,quantity})),method:card?'card_simulated':'cash',received,scenario:$('#scenario').value,discount:chosenPromotion()?0:Math.round(Number(discountInput.value)*100),discount_reason:chosenPromotion()?'':$('#discountreason').value,promotion_id:chosenPromotion()?.id||null,promotion_revision:chosenPromotion()?.revision||null,customer_id:$('#saleclient').value||null});
 db=result.state;completed=true;cart={};$('#modal').close();render();ticket(result.sale);
 }catch(error){status.hidden=false;status.textContent=error.message;

 }finally{busy=false;if(!completed){submit.disabled=false;method.disabled=false;$('#cancelpay').disabled=false;$('#scenario').disabled=false;promotionSelect.disabled=false;discountInput.disabled=!!chosenPromotion();$('#discountreason').disabled=!!chosenPromotion()}}};
}
function receiptMarkup(s){const m=n=>`${esc(s.settings.currency)} ${(n/100).toFixed(2)}`,card=s.payment?.method==='card_simulated';return `<article class="ticket">${s.settings.logo?`<img class="receipt-logo" alt="Logo del negocio" src="${esc(s.settings.logo)}">`:''}<h2>${esc(s.settings.name)}</h2><p>TICKET DE DEMOSTRACIÓN<br>SIN VALIDEZ FISCAL</p>${s.status==='voided'?'<p><strong>VENTA ANULADA</strong></p><p>'+esc(s.void?.reason||'')+'</p>':''}${s.customer?'<p>Cliente: '+esc(s.customer.name)+'</p>':''}${card?'<p><strong>PAGO CON TARJETA SIMULADO<br>NO SE REALIZÓ NINGÚN CARGO</strong></p>':''}<hr class="receipt-rule"><p>${esc(new Date(s.date).toLocaleString('es-HN'))}</p><p class="receipt-meta">Ref. ${esc(s.id)}</p><hr class="receipt-rule">${s.lines.map(l=>`<div class="receipt-item"><strong>${esc(l.name)}</strong><p>${l.quantity} × ${m(l.price)}</p><strong>${m(l.quantity*l.price)}</strong></div>`).join('')}${s.discount?`<p>Subtotal: ${m(s.subtotal)}<br>Descuento: −${m(s.discount)}<br>${esc(s.discount_reason)}${s.promotion?.kind==='bundle'?`<br>${s.promotion.buy_quantity}×${s.promotion.pay_quantity} · unidades del mismo producto`:''}</p>`:''}<div class="receipt-total">TOTAL ${m(s.total)}</div><p>${card?'Tarjeta · simulación':'Efectivo'}</p>${card?`<p>Referencia de prueba: ${esc(s.payment.reference)}<br>Tarjeta ficticia •••• 0000</p>`:`<p>Recibido: ${m(s.received)}<br>Cambio: ${m(s.received-s.total)}</p>`}<hr class="receipt-rule"><p class="receipt-footer">${esc(s.settings.message)}</p></article>`}
function ticket(s){const markup=receiptMarkup(s);$('#receipt').innerHTML=markup;modal(`<h2 style="text-align:center">Recibo de venta</h2>${markup}<div class="actions"><button data-close>Continuar</button><button class="primary" id="print">Imprimir recibo</button></div>`);$('#print').onclick=()=>window.print()}

function settings(){const s=db.settings;$('#view').innerHTML=`<div class="formgrid"><section class="panel"><h2>La identidad de tu negocio</h2><p>Perfil: <strong>${esc(activeProfile?.username||"Local")}</strong></p><form id="settings"><label>Plantilla visual</label><div id="templates" class="template-list"></div><div id="logoimage"></div><label class="checkrow"><input type="checkbox" name="require_shift" ${s.require_shift?'checked':''}>Exigir apertura de caja antes de vender</label><label>Nombre del negocio<input name="name" value="${esc(s.name)}" maxlength="70" required></label><label>Tipo de negocio<select name="type">${['Comida','Tienda','Negocio general'].map(t=>`<option ${s.type===t?'selected':''}>${t}</option>`).join('')}</select></label><p class="muted" style="margin-top:8px">Identifica tu negocio. Los módulos por tipo llegarán en otra versión.</p><label>Moneda<select name="currency">${['L','$','€'].map(c=>`<option ${s.currency===c?'selected':''}>${c}</option>`).join('')}</select></label><p class="muted" style="margin-top:8px">No convierte precios. Se bloquea al registrar la primera venta.</p><label>Color principal<input type="color" name="color" value="${esc(s.color)}"></label><label>Mensaje del ticket<input name="message" maxlength="120" value="${esc(s.message)}"></label><button class="primary wide" style="margin-top:20px">Guardar cambios</button></form></section><section><div class="panel"><h2>Un espacio con tu nombre</h2><div style="padding:30px;background:var(--bg);border-radius:12px;text-align:center"><img id="previewlogo" class="logo-preview" alt="Logo del negocio" ${s.logo?`src="${esc(s.logo)}"`:"hidden"}><h2 id="previewname">${esc(s.name)}</h2><p>Tu próximo cliente está por llegar.</p><button class="primary" style="margin-top:25px" disabled>Así se verá tu color</button></div></div><div class="panel" style="margin-top:20px"><h2>Tus datos, a mano</h2><p>Descarga catálogo, ventas, clientes, cajas y movimientos en un archivo JSON.</p><button id="export" class="wide" style="margin-top:15px">Descargar copia de datos</button><div class="notice">Prototipo para evaluar el diseño. Datos guardados en el servidor. Esta base necesita conexión para vender. No incluye facturación fiscal ni cobros bancarios reales. Las copias JSON son de exportación; la restauración guiada está pendiente.</div></div><div class="panel" style="margin-top:20px"><h2>Conexión BAC HIT</h2><p>Estado: pendiente de integración oficial.</p><p>No se envían cobros a HIT. Puedes probar tarjetas simuladas desde la caja.</p></div><div class="panel" style="margin-top:20px"><h2>Actualizaciones</h2><p>Versión 0.5.1 beta · servidor · prototipo</p><p style="margin-top:12px">Esta interfaz se sirve desde el servidor. Al actualizar el servidor, recarga para abrir la versión nueva. El instalador Windows con actualizaciones firmadas está en el roadmap.</p><span class="badge" style="display:inline-block;margin-top:12px">Instalador Windows: pendiente</span></div></section></div>`;const f=$('#settings');let chosenTemplate=s.template||'natural';drawTemplates(f,chosenTemplate,key=>chosenTemplate=key);const logo=imagePicker($('#logoimage'),s.logo||'',true,value=>{const img=$('#previewlogo');img.hidden=!value;if(value)img.src=value;else img.removeAttribute('src')});f.elements.currency.disabled=db.sales.length>0;f.elements.name.oninput=e=>$('#previewname').textContent=e.target.value;f.elements.color.oninput=e=>document.documentElement.style.setProperty('--accent',e.target.value);f.onsubmit=async e=>{e.preventDefault();if(logo.busy())return toast('Espera a que termine de cargar el logo');const old=structuredClone(db);const data=Object.fromEntries(new FormData(f));data.require_shift=f.elements.require_shift.checked;if(!data.name.trim())return;db.settings={...db.settings,...data,name:data.name.trim(),logo:logo.value(),template:chosenTemplate};if(!await persist()){db=old;return}render();toast('Tu negocio ya tiene su estilo')};guardForm(f);$('#export').onclick=async()=>{let exporte function imagePicker(container,current,isLogo,onChange=()=>{}){
 let value=current,busy=false,sequence=0;
 container.innerHTML=`<div class="imagebox"><label>${isLogo?'Logo del negocio':'Foto del producto'}</label><img class="imagepreview" alt="Vista previa" ${current?`src="${esc(current)}"`:'hidden'}><input aria-label="${isLogo?'Subir logo':'Subir foto del producto'}" type="file" accept="image/png,image/jpeg,image/webp"><p class="muted">PNG, JPG o WebP · máximo 8 MB. Se optimiza al cargar.</p><button type="button">Quitar imagen</button><p class="muted" role="status"></p></div>`;
 const input=container.querySelector('input'),preview=container.querySelector('img'),remove=container.querySelector('button'),status=container.querySelector('[role=status]');
 const update=()=>{preview.hidden=!value;if(value)preview.src=value;else preview.removeAttribute('src');remove.disabled=!value&&!busy;onChange(value)};
 remove.onclick=()=>{sequence++;busy=false;value='';input.value='';status.textContent='';update()};
 input.onchange=async()=>{const file=input.files[0];if(!file)return;const token=++sequence;busy=true;status.textContent='Preparando imagen…';remove.disabled=false;
 try{const result=await optimizeImage(file,isLogo);if(token!==sequence)return;value=result;status.textContent='Imagen lista. Guarda los cambios para conservarla.';update()}
 catch(error){if(token===sequence){status.textContent=error.message;input.value=''}}
 finally{if(token===sequence){busy=false;remove.disabled=!value}}};
 update();return{value:()=>value,busy:()=>busy};
}
async function optimizeImage(file,isLogo){
 if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Elige una imagen PNG, JPG o WebP.');
 if(file.size>8*1024*1024)throw Error('La imagen supera los 8 MB. Elige una más pequeña.');
 const url=URL.createObjectURL(file);
 try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('No se pudo abrir esta imagen. Prueba con otra.'));img.src=url});
 if(!img.naturalWidth||!img.naturalHeight||img.naturalWidth*img.naturalHeight>40000000)throw Error('La imagen es demasiado grande. Reduce sus dimensiones.');
 const max=isLogo?300:640,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
 const context=canvas.getContext('2d');if(!context)throw Error('Este navegador no puede procesar imágenes.');context.drawImage(img,0,0,canvas.width,canvas.height);
 const result=canvas.toDataURL('image/webp',.8);if(result.length>450000)throw Error('La imagen sigue siendo muy pesada. Usa una más sencilla.');return result;
 }finally{URL.revokeObjectURL(url)}
}

async function cashPage(){

 $('#view').innerHTML=`<div class="section-heading"><div><h2>Tu efectivo, sin perder la cuenta</h2><p>Una caja compartida por negocio. Los cierres quedan guardados.</p></div><span class="pill ${s?'':'warning'}">${s?'Abierta desde '+billingDate(s.opened):'Sin caja abierta'}</span></div>${s?`<div class="metrics"><article class="panel"><span>Fondo inicial</span><strong>${money(s.opening)}</strong></article><article class="panel"><span>Ventas en efectivo</span><strong>${money(s.income)}</strong><small>${s.sales_count} ventas · antes de devoluciones</small></article><article class="panel"><span>Devoluciones</span><strong>${money(s.refunds)}</strong></article><article class="panel metric-accent"><span>Efectivo esperado</span><strong>${money(s.balance)}</strong><small>Incluye entradas y salidas</small></article></div><section class="panel"><div class="section-heading"><div><h2>Movimientos de caja</h2><p>Registra gastos, retiros o aportes de efectivo.</p></div><div class="button-group"><button id="cashmove">+ Entrada / salida</button><button id="closecash" class="primary">Cerrar caja</button></div></div>${s.movements.length?`<table><thead><tr><th>Fecha</th><th>Motivo</th><th>Importe</th></tr></thead><tbody>${s.movements.map(m=>`<tr><td>${billingDate(m.created)}</td><td>${esc(m.reason)}</td><td>${m.amount>0?'+':''}${money(m.amount)}</td></tr>`).join('')}</tbody></table>`:rowEmpty('Sin entradas ni salidas adicionales')}</section>`:`<section class="start-cash panel"><span>◈</span><h2>Prepara tu caja para el día</h2><p>Indica cuánto efectivo tienes antes de empezar a vender.</p><button class="primary" id="opencash">Abrir caja</button></section>`}<section class="panel" style="margin-top:24px"><h2>Historial de cierres</h2><p>Últimos 100 cierres · los importes del cierre no se modifican.</p><div class="table-wrap">${data.closed.length?`<table><thead><tr><th>Cierre</th><th>Esperado</th><th>Contado</th><th>Diferencia</th><th>Nota</th></tr></thead><tbody>${data.closed.map(s=>`<tr><td>${billingDate(s.closed)}</td><td>${money(s.expected)}</td><td>${money(s.counted)}</td><td><span class="pill ${s.counted===s.expected?'':'warning'}">${money(s.counted-s.expected)}</span></td><td>${esc(s.note)}</td></tr>`).join('')}</tbody></table>`:rowEmpty('Tu primer cierre aparecerá aquí')}</div></section><div class="notice">Las tarjetas simuladas no afectan el saldo. Las ventas hechas sin una caja abierta no se incorporan después a una caja nueva.</div>`;
 if(s){$('#cashmove').onclick=()=>cashForm('movement',s);$('#closecash').onclick=()=>cashForm('close',s)}else $('#opencash').onclick=()=>cashForm('open');
}
function cashForm(kind,s){const rid=crypto.randomUUID(),close=kind==='close';modal(`<h2>${close?'Cerrar y conciliar caja':kind==='open'?'Abrir caja':'Entrada o salida'}</h2>${close?`<p>Esperado ahora: ${money(s.balance)}. Cuenta el efectivo físico antes de confirmar.</p>`:''}<form id="cashform">${kind==='movement'?'<label>Tipo<select name="kind"><option value="out">Salida · gasto o retiro</option><option value="in">Entrada · aporte</option></select></label>':''}<label>${close?'Efectivo contado':kind==='open'?'Fondo inicial':'Importe'}<input name="amount" type="number" min="${kind==='movement'?'0.01':'0'}" max="10000000000" step="0.01" required></label>${kind!=='open'?'<label>Motivo / nota<input name="note" minlength="3" maxlength="200" required></label>':''}${close?'<div class="notice">El saldo se calculará de nuevo al confirmar para incluir ventas de otros equipos. El cierre no se puede editar.</div>':''}<p id="casherror" role="alert"></p><div class="actions"><button type="button" data-close>Cancelar</button><button class="primary">${close?'Confirmar cierre':'Guardar'}</button></div></form>`);const f=$('#cashform');f.onsubmit=async e=>{e.preventDefault();const amount=Math.round(Number(f.elements.amount.value)*100);try{if(kind==='open')await api('/api/cash/open','POST',{request_id:rid,opening:amount});else if(close)await api('/api/cash/'+s.id+'/close','POST',{counted:amount,note:f.elements.note.value});else await api('/api/cash/'+s.id+'/movement','POST',{request_id:rid,amount,kind:f.elements.kind.value,reason:f.elements.note.value});$('#modal').close();await cashPage()}catch(e){$('#casherror').textContent=e.message}};guardForm(f)}
function sales(){const rows=activeSales(),cash=rows.filter(s=>s.payment?.method!=='card_simulated'),sim=rows.filter(s=>s.payment?.method==='card_simulated'),sum=rows=>rows.reduce((n,s)=>n+s.total,0);$('#view').innerHTML=`<div class="stats"><div class="panel"><p>Efectivo · ventas vigentes</p><div class="stat">${money(sum(cash))}</div><p>Después de descuentos y anulaciones</p></div><div class="panel"><p>Tarjetas · simulación</p><div class="stat">${money(sum(sim))}</div><p>Sin cargos reales</p></div><div class="panel"><p>Ventas anuladas</p><div class="stat">${db.sales.length-rows.length}</div><p>Conservadas para consulta</p></div></div><section class="panel"><div class="section-heading"><h2>Historial de ventas</h2><p>${db.sales.length} registros</p></div><div class="filter-bar"><input id="salessearch" placeholder="Buscar referencia o cliente…" aria-label="Buscar venta"><select id="salesfilter" aria-label="Filtrar ventas"><option value="all">Todas</option><option value="cash">Efectivo vigente</option><option value="sim">Simulaciones vigentes</option><option value="voided">Anuladas</option></select></div><div id="salesrows" class="table-wrap"></div></section>`;
 const draw=()=>{const q=$('#salessearch').value.toLowerCase(),f=$('#salesfilter').value,list=[...db.sales].reverse().filter(s=>(s.id+' '+(s.customer?.name||'Consumidor final')).toLowerCase().includes(q)&&(f==='all'||f==='voided'&&s.status==='voided'||s.status!=='voided'&&(f==='cash'&&s.payment?.method!=='card_simulated'||f==='sim'&&s.payment?.method==='card_simulated')));$('#salesrows').innerHTML=list.length?`<table><thead><tr><th>Fecha / cliente</th><th>Método</th><th>Total</th><th>Estado</th><th></th></tr></thead><tbody>${list.map(s=>`<tr><td><strong>${esc(s.customer?.name||'Consumidor final')}</strong><small class="block">${localDate(s.date)}</small></td><td>${s.payment?.method==='card_simulated'?'Simulación':'Efectivo'}</td><td>${money(s.total)}</td><td><span class="pill ${s.status==='voided'?'danger':''}">${s.status==='voided'?'Anulada':'Registrada'}</span></td><td><div class="button-group"><button data-ticket="${s.id}">Recibo</button>${s.status!=='voided'?`<button data-void="${s.id}">Anular</button>`:''}</div></td></tr>`).join('')}</tbody></table>`:rowEmpty('Sin ventas con este filtro');$('#salesrows').querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>ticket(db.sales.find(s=>s.id===b.dataset.ticket)));$('#salesrows').querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>voidForm(db.sales.find(s=>s.id===b.dataset.void)))};$('#salessearch').oninput=draw;$('#salesfilter').onchange=draw;draw();
}
function voidForm(s){const cash=s.payment?.method!=='card_simulated';modal(`<h2>Anular venta completa</h2><p>Importe: ${money(s.total)}</p><div class="notice">Se repondrán todos los productos y quedará registrada la anulación. Úsalo solo si los artículos vuelven al inventario. No admite devoluciones parciales.${cash?' El efectivo se descontará de la caja actualmente abierta.':''}</div><form id="voidform"><label>Motivo<input name="reason" minlength="3" maxlength="200" required></label>${cash?'<label class="checkrow"><input type="checkbox" name="confirmed" required>Confirmo que devolví el efectivo al cliente. Punto no devuelve dinero automáticamente.</label>':''}<p id="voiderror" role="alert"></p><div class="actions"><button type="button" data-close>Cancelar</button><button class="primary">Confirmar anulación</button></div></form>`);const f=$('#voidform');f.onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/sales/'+s.id+'/void','POST',{reason:f.elements.reason.value,refund_confirmed:cash?f.elements.confirmed.checked:false});db=r.state;cart={};$('#modal').close();render();toast('Venta anulada e inventario repuesto')}catch(e){$('#voiderror').textContent=e.message}};guardForm(f)}

let promotionsCache=[];
function promotionState(p){const today=dayHN(new Date());return !p.active?'Pausada':today<p.starts?'Programada':p.ends&&today>p.ends?'Vencida':'Vigente'}
function promotionLabel(p){return p.kind==='bundle'?`${p.buy_quantity}×${p.pay_quantity} · mismo producto`:p.kind==='percent'?p.value+'% de descuento':money(p.value)+' de descuento'}
function promotionDiscount(p){if(promotionState(p)!=='Vigente'||total()<p.minimum)return 0;if(p.kind==='bundle')return Object.entries(cart).reduce((n,[id,q])=>n+(!p.product_ids.length||p.product_ids.includes(id)?Math.floor(q/p.buy_quantity)*(p.buy_quantity-p.pay_quantity)*db.products.find(x=>x.id===id).price:0),0);const eligible=Object.entries(cart).reduce((n,[id,q])=>n+(!p.product_ids.length||p.product_ids.includes(id)?db.products.find(x=>x.id===id).price*q:0),0);return p.kind==='percent'?Math.floor((eligible*p.value+50)/100):Math.min(eligible,p.value)}
async function promotionsPage(){
 const list=await api('/api/promotions');promotionsCache=list;if(page!=='Promociones')return;
 $('#view').innerHTML=`<section class="hero"><span class="eyebrow">DALE UNA RAZÓN PARA VOLVER</span><h2>Promociones a tu medida.</h2><p>Descuentos, 2×1 y ofertas a tu medida, con vigencia y productos elegidos por ti.</p></section><div class="section-heading"><div><h2>Tus promociones</h2><p>Incluidas en Básico y Pro. Selecciona una al cobrar.</p></div><button id="newpromotion" class="primary">+ Crear promoción</button></div><section class="panel"><div class="filter-bar"><input id="promotionsearch" placeholder="Buscar promoción…" aria-label="Buscar promoción"><select id="promotionfilter" aria-label="Estado de promoción"><option value="all">Todos los estados</option><option>Vigente</option><option>Programada</option><option>Pausada</option><option>Vencida</option></select></div><div id="promotionrows" class="table-wrap"></div></section><div class="notice">Se aplica una promoción por venta y no se combina con descuentos manuales. El monto fijo se descuenta una vez del conjunto de productos elegibles, nunca por unidad. En 2×1 y similares, cada grupo se forma con unidades del mismo producto; no se mezclan productos distintos. Fechas de Honduras, incluido el día final.</div>`;
 const draw=()=>{const q=$('#promotionsearch').value.toLowerCase(),status=$('#promotionfilter').value,rows=list.filter(p=>p.name.toLowerCase().includes(q)&&(status==='all'||promotionState(p)===status));$('#promotionrows').innerHTML=rows.length?`<table><thead><tr><th>Promoción</th><th>Productos</th><th>Vigencia / mínimo</th><th>Estado</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td><strong>${esc(p.name)}</strong><small class="block">${promotionLabel(p)}</small></td><td>${p.product_ids.length?p.product_ids.length+' seleccionados':'Todo el catálogo'}</td><td>${p.starts} → ${p.ends||'Sin fecha final'}<small class="block">Compra mínima: ${money(p.minimum)}</small></td><td><span class="pill ${promotionState(p)==='Vigente'?'':'warning'}">${promotionState(p)}</span></td><td><div class="button-group"><button data-promo-edit="${p.id}">Editar</button><button data-promo-toggle="${p.id}">${p.active?'Pausar':'Activar'}</button></div></td></tr>`).join('')}</tbody></table>`:rowEmpty('No hay promociones con este filtro');$('#promotionrows').querySelectorAll('[data-promo-edit]').forEach(b=>b.onclick=()=>editPromotion(list.find(p=>p.id===b.dataset.promoEdit)));$('#promotionrows').querySelectorAll('[data-promo-toggle]').forEach(b=>b.onclick=async()=>{b.disabled=true;const p=list.find(p=>p.id===b.dataset.promoToggle),{id,...data}=p;try{await api('/api/promotions/'+id,'PUT',{...data,active:!p.active});await promotionsPage()}catch(e){toast(e.message);b.disabled=false}})};$('#promotionsearch').oninput=draw;$('#promotionfilter').onchange=draw;$('#newpromotion').onclick=()=>editPromotion();draw();
}
function editPromotion(p={id:crypto.randomUUID(),name:'',kind:'percent',value:10,minimum:0,product_ids:[],starts:dayHN(new Date()),ends:null,active:true,revision:0}){
 const preset=p.kind==='bundle'?(['2:1','3:2','4:3'].includes(p.buy_quantity+':'+p.pay_quantity)?p.buy_quantity+':'+p.pay_quantity:'bundle'):p.kind;
 const deleted=p.product_ids.filter(id=>!db.products.some(x=>x.id===id));
 modal(`<h2>${p.revision?'Editar':'Crear'} promoción</h2><form id="promotionform"><label>Nombre<input name="name" maxlength="70" required value="${esc(p.name)}" placeholder="Ej.: Semana del café"></label><div class="checkout-discount"><label>Tipo<select name="kind"><option value="percent" ${p.kind==='percent'?'selected':''}>Porcentaje</option><option value="fixed" ${p.kind==='fixed'?'selected':''}>Monto fijo</option>${[['2:1','2×1 · lleva 2, paga 1'],['3:2','3×2 · lleva 3, paga 2'],['4:3','4×3 · lleva 4, paga 3'],['bundle','Lleva X, paga Y · personalizar']].map(([key,label])=>`<option value="${key}" ${preset===key?'selected':''}>${label}</option>`).join('')}</select></label><label id="promotionvaluefield"><span id="promotionvaluelabel">Descuento</span><input name="value" type="number" required value="${p.kind==='percent'?p.value:(p.value/100).toFixed(2)}"></label></div><div id="bundlefields" class="checkout-discount"><label>Unidades que lleva<input name="buy_quantity" type="number" min="2" max="100" step="1" value="${p.buy_quantity||2}" required></label><label>Unidades que paga<input name="pay_quantity" type="number" min="1" max="99" step="1" value="${p.pay_quantity||1}" required></label></div><label>Compra mínima total (${esc(db.settings.currency)})<input name="minimum" type="number" min="0" max="10000000000" step="0.01" value="${p.minimum/100}" required></label><div class="checkout-discount"><label>Desde · Honduras<input name="starts" type="date" value="${p.starts}" required></label><label>Hasta · opcional<input name="ends" type="date" value="${p.ends||''}"></label></div><label>Aplicar a<select name="scope"><option value="all" ${!p.product_ids.length?'selected':''}>Todo el catálogo</option><option value="selected" ${p.product_ids.length?'selected':''}>Productos seleccionados</option></select></label><div id="promotionproducts" class="promotion-products">${db.products.map(x=>`<label class="checkrow"><input type="checkbox" name="product" value="${x.id}" ${p.product_ids.includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')}${deleted.map(id=>`<label class="checkrow"><input type="checkbox" name="product" value="${esc(id)}" checked>Producto eliminado (${esc(id)})</label>`).join('')}${!db.products.length&&!deleted.length?'<p>Primero agrega productos al catálogo.</p>':''}</div><label class="checkrow"><input name="active" type="checkbox" ${p.active?'checked':''}>Promoción activa</label><p id="promotionpreview" class="notice"></p><p id="promotionerror" role="alert"></p><div class="actions"><button type="button" data-close>Cancelar</button><button class="primary">Guardar promoción</button></div></form>`);
 const f=$('#promotionform');let lastKind=f.elements.kind.value;
 const isBundle=()=>!['percent','fixed'].includes(f.elements.kind.value);
 const preview=()=>{const percent=f.elements.kind.value==='percent',bundle=isBundle(),preset=f.elements.kind.value.includes(':');
 if(preset){const [buy,pay]=f.elements.kind.value.split(':');f.elements.buy_quantity.value=buy;f.elements.pay_quantity.value=pay}
 $('#promotionvaluefield').hidden=bundle;f.elements.value.disabled=bundle;$('#bundlefields').hidden=!bundle;f.elements.buy_quantity.disabled=!bundle;f.elements.pay_quantity.disabled=!bundle;f.elements.buy_quantity.readOnly=preset;f.elements.pay_quantity.readOnly=preset;f.elements.pay_quantity.max=Number(f.elements.buy_quantity.value)-1;
 f.elements.value.min=percent?'1':'0.01';f.elements.value.max=percent?'100':'10000000';f.elements.value.step=percent?'1':'0.01';$('#promotionvaluelabel').textContent=percent?'Porcentaje (%)':'Monto ('+db.settings.currency+')';$('#promotionproducts').hidden=f.elements.scope.value==='all';f.elements.ends.min=f.elements.starts.value;
 $('#promotionpreview').textContent=bundle?`Por cada ${f.elements.buy_quantity.value} unidades del mismo producto, se pagan ${f.elements.pay_quantity.value}. Las unidades restantes se cobran al precio normal. No se mezclan productos distintos.`:percent?'Se descuenta este porcentaje del importe de los productos elegibles.':'Se descuenta este monto una vez de los productos elegibles, hasta el importe de esos productos.'};
 f.elements.kind.onchange=()=>{if(lastKind!==f.elements.kind.value&&!isBundle())f.elements.value.value=f.elements.kind.value==='percent'?'10':'10.00';lastKind=f.elements.kind.value;preview()};f.elements.scope.onchange=preview;f.elements.starts.onchange=preview;f.elements.buy_quantity.oninput=preview;f.elements.pay_quantity.oninput=preview;preview();
 f.onsubmit=async e=>{e.preventDefault();const products=f.elements.scope.value==='all'?[]:[...f.querySelectorAll('[name=product]:checked')].map(x=>x.value);if(f.elements.scope.value==='selected'&&!products.length){$('#promotionerror').textContent='Selecciona al menos un producto.';return}try{await api('/api/promotions/'+p.id,'PUT',{name:f.elements.name.value,kind:isBundle()?'bundle':f.elements.kind.value,value:isBundle()?1:f.elements.kind.value==='percent'?Number(f.elements.value.value):Math.round(Number(f.elements.value.value)*100),buy_quantity:isBundle()?Number(f.elements.buy_quantity.value):2,pay_quantity:isBundle()?Number(f.elements.pay_quantity.value):1,minimum:Math.round(Number(f.elements.minimum.value)*100),starts:f.elements.starts.value,ends:f.elements.ends.value||null,active:f.elements.active.checked,product_ids:products,revision:p.revision});$('#modal').close();await promotionsPage();toast('Promoción guardada')}catch(e){$('#promotionerror').textContent=e.message}};guardForm(f);
}

showAuth();enterProfile().catch(()=>{});
